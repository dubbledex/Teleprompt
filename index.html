<script>
"use strict";

/* ──────────────────────────────────────────────────────────────────────────
   Globals
────────────────────────────────────────────────────────────────────────── */

var STORAGE_KEY = "canvas_teleprompter_v7";
var SR = window.SpeechRecognition || window.webkitSpeechRecognition;

var defaultState = {
  text:
    "Welcome to the Canvas Teleprompter.\n\n" +
    "This version features an improved voice engine.\n\n" +
    "The line being recognised is highlighted in yellow so you can verify it is tracking correctly.\n\n" +
    "Scroll speed is derived from your live speaking rate in words per minute.\n\n" +
    "A phantom cursor advances every frame so scrolling is always continuous.\n\n" +
    "Recognition events push the phantom forward — the scroll spring chases it smoothly.\n\n" +
    "Empty lines between paragraphs are handled automatically.\n\n" +
    "Remote controls:\n" +
    "- PageDown speeds up in manual mode\n" +
    "- PageUp slows down in manual mode\n" +
    "- Space starts or stops manual scrolling\n" +
    "- R resets scroll position\n" +
    "- Escape exits the prompter\n\n" +
    "Uploading a new script resets speed and position.",
  fileName: "teleprompter-script.txt",
  flipH: false,
  flipV: false,
  textSize: 48,
  indent: 15,
  textColor: "#ffffff",
  bgColor: "#000000",
  bgOpacity: 100,
  focusEnabled: true,
  focusHeight: 90,
  focusOffset: 35,
  voiceMode: false,
  startSpeed: 2,
  bindings: {
    speedUp:   { code: "PageDown", key: "PageDown" },
    speedDown: { code: "PageUp",   key: "PageUp" },
    toggle:    { code: "Space",    key: " " },
    reset:     { code: "KeyR",     key: "r" },
    exit:      { code: "Escape",   key: "Escape" }
  }
};

var state = deepClone(defaultState);

var canvas = null;
var ctx = null;
var dpr = 1;
var canvasW = 0;
var canvasH = 0;

var lines = [];
var lineWords = [];
var lineCharStarts = [];
var lineHeight = 0;
var startY = 0;
var focusY = 0;
var maxScroll = 0;

var scrollPos = 0;
var currentSpeed = 0;
var isScrolling = false;
var rafId = null;
var lastTime = 0;

var recognition = null;
var isListening = false;

var voiceCurrentLine = 0;
var voicePhantom = 0;
var voiceCurrentWPM = 150;
var voicePrevLine = 0;
var voicePrevLineTime = 0;
var voiceSessionStart = 0;
var voiceFinalBuf = "";
var voiceInterimBuf = "";

var els = {};
var captureAction = null;

var VOICE_LINE_SPACING = 1.8;
var MANUAL_LINE_SPACING = 1.45;
var REMOTE_SPEED_STEP = 0.25;
var PX_PER_SPEED_UNIT = 18;

var V_MIN_WPM = 80;
var V_MAX_WPM = 280;
var V_SPRING_K = 8;
var V_MAX_PX_S = 700;
var V_SEARCH = 6;
var V_THRESH = 0.20;
var V_BURST = 1.6;

/* ──────────────────────────────────────────────────────────────────────────
   Utilities
────────────────────────────────────────────────────────────────────────── */

function deepClone(v) {
  return JSON.parse(JSON.stringify(v));
}

function byId(id) {
  return document.getElementById(id);
}

function setProp(id, prop, value) {
  var el = els[id];
  if (el) el[prop] = value;
}

function listen(id, event, fn) {
  var el = els[id];
  if (el) el.addEventListener(event, fn);
}

function clamp(n, min, max) {
  return Math.max(min, Math.min(max, n));
}

/* ──────────────────────────────────────────────────────────────────────────
   Init
────────────────────────────────────────────────────────────────────────── */

function init() {
  cacheElements();
  loadState();
  renderSetup();
  renderKeyBindings();
  updateFlipButtons();

  canvas = els.prompterCanvas;
  if (!canvas) {
    console.error("Teleprompter canvas not found.");
    return;
  }

  ctx = canvas.getContext("2d", { alpha: false });
  if (!ctx) {
    console.error("Could not create 2D canvas context.");
    return;
  }

  setupSpeechRecognition();
  wireUI();
}

function cacheElements() {
  [
    "setupPage", "prompterPage", "prompterCanvas",
    "startPromptBtn", "clearSettingsBtn", "flipHBtn", "flipVBtn",
    "textSizeInput", "textSizeLabel", "indentInput", "indentLabel",
    "textColorInput", "bgColorInput",
    "focusEnabledInput", "focusHeightInput", "focusHeightLabel",
    "focusOffsetInput", "focusOffsetLabel",
    "voiceModeInput", "startSpeedInput", "startSpeedLabel",
    "presenterPresetBtn", "resetBindingsBtn",
    "scriptInput", "fileNameInput", "importBtn", "fileInput", "exportTxtBtn",
    "mobileExitBtn", "resetScriptBtn", "voiceToggleBtn", "voiceStatusText",
    "speedHud", "wpmHud", "modeHud"
  ].forEach(function(id) {
    els[id] = byId(id);
    if (!els[id]) console.warn("Teleprompter: missing #" + id);
  });
}

/* ──────────────────────────────────────────────────────────────────────────
   Persistence
────────────────────────────────────────────────────────────────────────── */

function loadState() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;

    var saved = JSON.parse(raw);
    state = Object.assign(deepClone(defaultState), saved);
    state.bindings = Object.assign(deepClone(defaultState.bindings), saved.bindings || {});
  } catch (err) {
    console.warn("Failed to load state:", err);
    state = deepClone(defaultState);
  }
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (err) {}
}

/* ──────────────────────────────────────────────────────────────────────────
   Setup UI
────────────────────────────────────────────────────────────────────────── */

function renderSetup() {
  setProp("scriptInput", "value", state.text);
  setProp("fileNameInput", "value", state.fileName);
  setProp("textSizeInput", "value", state.textSize);
  setProp("textSizeLabel", "textContent", state.textSize + "px");
  setProp("indentInput", "value", state.indent);
  setProp("indentLabel", "textContent", state.indent + "%");
  setProp("textColorInput", "value", state.textColor);
  setProp("bgColorInput", "value", state.bgColor);
  setProp("focusEnabledInput", "checked", !!state.focusEnabled);
  setProp("focusHeightInput", "value", state.focusHeight);
  setProp("focusHeightLabel", "textContent", state.focusHeight + "px");
  setProp("focusOffsetInput", "value", state.focusOffset);
  setProp("focusOffsetLabel", "textContent", state.focusOffset + "%");
  setProp("voiceModeInput", "checked", !!state.voiceMode);
  setProp("startSpeedInput", "value", state.startSpeed);
  setProp("startSpeedLabel", "textContent", String(state.startSpeed));
}

function updateFlipButtons() {
  if (els.flipHBtn) els.flipHBtn.classList.toggle("btn-active", !!state.flipH);
  if (els.flipVBtn) els.flipVBtn.classList.toggle("btn-active", !!state.flipV);
}

function renderKeyBindings() {
  var map = {
    speedUp: "btn-bind-speedUp",
    speedDown: "btn-bind-speedDown",
    toggle: "btn-bind-toggle",
    reset: "btn-bind-reset",
    exit: "btn-bind-exit"
  };

  Object.keys(map).forEach(function(action) {
    var btn = byId(map[action]);
    if (!btn) return;
    var b = state.bindings[action];
    btn.textContent = (b.key === " ") ? "Space" : (b.key || b.code || "Unset");
    btn.classList.toggle("capturing", captureAction === action);
  });
}

/* ──────────────────────────────────────────────────────────────────────────
   Speech Recognition
────────────────────────────────────────────────────────────────────────── */

function setupSpeechRecognition() {
  if (!SR) {
    setProp("voiceModeInput", "disabled", true);
    setProp("voiceModeInput", "checked", false);
    state.voiceMode = false;
    return;
  }

  recognition = new SR();
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.lang = "en-US";

  recognition.onresult = handleSpeechResult;
  recognition.onerror = function(ev) {
    if (ev.error !== "no-speech") console.warn("SpeechRecognition error:", ev.error);
  };
  recognition.onend = function() {
    if (state.voiceMode && isListening) {
      try {
        recognition.start();
      } catch (err) {}
    } else {
      isListening = false;
      updateVoiceUI();
    }
  };
}

/* ──────────────────────────────────────────────────────────────────────────
   UI Wiring
────────────────────────────────────────────────────────────────────────── */

function wireUI() {
  listen("startPromptBtn", "click", startPrompter);
  listen("mobileExitBtn", "click", stopPrompter);
  listen("resetScriptBtn", "click", resetScriptPositionKeepSpeed);

  listen("clearSettingsBtn", "click", function() {
    if (!confirm("Reset all settings and script?")) return;
    localStorage.removeItem(STORAGE_KEY);
    location.reload();
  });

  listen("flipHBtn", "click", function() {
    state.flipH = !state.flipH;
    saveState();
    updateFlipButtons();
    if (isPrompterOpen()) drawCanvasFrame();
  });

  listen("flipVBtn", "click", function() {
    state.flipV = !state.flipV;
    saveState();
    updateFlipButtons();
    if (isPrompterOpen()) drawCanvasFrame();
  });

  bindRange("textSizeInput", "textSize", "textSizeLabel", "px");
  bindRange("indentInput", "indent", "indentLabel", "%");
  bindRange("focusHeightInput", "focusHeight", "focusHeightLabel", "px");
  bindRange("focusOffsetInput", "focusOffset", "focusOffsetLabel", "%");
  bindRange("startSpeedInput", "startSpeed", "startSpeedLabel", "");

  listen("textColorInput", "input", function() {
    state.textColor = els.textColorInput.value;
    saveState();
    if (isPrompterOpen()) drawCanvasFrame();
  });

  listen("bgColorInput", "input", function() {
    state.bgColor = els.bgColorInput.value;
    saveState();
    if (isPrompterOpen()) drawCanvasFrame();
  });

  listen("focusEnabledInput", "change", function() {
    state.focusEnabled = els.focusEnabledInput.checked;
    saveState();
    if (isPrompterOpen()) drawCanvasFrame();
  });

  listen("voiceModeInput", "change", function() {
    state.voiceMode = els.voiceModeInput.checked;
    saveState();
    applyVoiceModeChange();
  });

  listen("voiceToggleBtn", "click", function() {
    state.voiceMode = !state.voiceMode;
    setProp("voiceModeInput", "checked", state.voiceMode);
    saveState();
    applyVoiceModeChange();
  });

  listen("presenterPresetBtn", "click", function() {
    state.bindings = deepClone(defaultState.bindings);
    saveState();
    renderKeyBindings();
    alert("Remote preset applied.");
  });

  listen("resetBindingsBtn", "click", function() {
    state.bindings = deepClone(defaultState.bindings);
    saveState();
    renderKeyBindings();
  });

  document.querySelectorAll(".key-btn").forEach(function(btn) {
    btn.addEventListener("click", function() {
      startCapture(btn.dataset.bind);
    });
  });

  listen("importBtn", "click", function() {
    if (els.fileInput) els.fileInput.click();
  });

  listen("fileInput", "change", importScriptFile);
  listen("exportTxtBtn", "click", exportTxtFile);

  listen("scriptInput", "input", function() {
    state.text = els.scriptInput.value;
    saveState();
  });

  listen("fileNameInput", "input", function() {
    state.fileName = els.fileNameInput.value || "teleprompter-script.txt";
    saveState();
  });

  window.addEventListener("keydown", handleKeyDown, { passive: false });

  window.addEventListener("resize", function() {
    if (!isPrompterOpen()) return;
    prepareCanvasAndText();
    scrollPos = clamp(scrollPos, 0, maxScroll);
    if (state.voiceMode) {
      voicePhantom = Math.max(voicePhantom, scrollPos);
    }
    drawCanvasFrame();
  });
}

function bindRange(inputId, stateKey, labelId, suffix) {
  var input = els[inputId];
  if (!input) return;

  input.addEventListener("input", function() {
    var value = Number(input.value);
    state[stateKey] = value;
    setProp(labelId, "textContent", value + suffix);
    saveState();

    if (isPrompterOpen()) {
      prepareCanvasAndText();
      scrollPos = clamp(scrollPos, 0, maxScroll);
      drawCanvasFrame();
    }
  });
}

function startCapture(action) {
  captureAction = action;
  renderKeyBindings();

  var handler = function(ev) {
    ev.preventDefault();
    ev.stopPropagation();
    state.bindings[action] = { code: ev.code, key: ev.key };
    captureAction = null;
    saveState();
    renderKeyBindings();
    window.removeEventListener("keydown", handler, true);
  };

  window.addEventListener("keydown", handler, true);
}

function isPrompterOpen() {
  return !!els.prompterPage && !els.prompterPage.classList.contains("hidden");
}

function applyVoiceModeChange() {
  if (isPrompterOpen()) {
    prepareCanvasAndText();
    resetVoiceController();
    scrollPos = state.voiceMode ? getVoiceStartScroll() : 0;
    currentSpeed = 0;
    isScrolling = false;
    drawCanvasFrame();
    updateHud();
  }

  syncVoiceListening();
}

/* ──────────────────────────────────────────────────────────────────────────
   File I/O
────────────────────────────────────────────────────────────────────────── */

function importScriptFile(event) {
  var file = event.target.files && event.target.files[0];
  if (!file) return;

  var reader = new FileReader();
  reader.onload = function() {
    var text = String(reader.result || "");

    if (file.name.toLowerCase().endsWith(".rtf")) {
      text = text
        .replace(/\\par[d]?/g, "\n")
        .replace(/\\[a-zA-Z]+-?\d* ?/g, "")
        .replace(/[{}]/g, "")
        .trim();
    }

    state.text = text;
    state.fileName = file.name;

    setProp("scriptInput", "value", text);
    setProp("fileNameInput", "value", file.name);

    scrollPos = 0;
    currentSpeed = 0;
    isScrolling = false;
    resetVoiceController();

    saveState();

    if (els.fileInput) els.fileInput.value = "";
  };

  reader.readAsText(file);
}

function exportTxtFile() {
  var blob = new Blob([state.text || ""], { type: "text/plain" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = state.fileName || "teleprompter-script.txt";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

/* ──────────────────────────────────────────────────────────────────────────
   Keyboard
────────────────────────────────────────────────────────────────────────── */

function handleKeyDown(event) {
  if (captureAction) return;
  if (!isPrompterOpen()) return;

  event.preventDefault();

  var code = event.code;
  var key = event.key;

  if (matchBinding("exit", code, key)) {
    stopPrompter();
    return;
  }

  if (matchBinding("reset", code, key)) {
    resetScriptPositionKeepSpeed();
    return;
  }

  if (matchBinding("toggle", code, key)) {
    if (state.voiceMode) {
      state.voiceMode = false;
      setProp("voiceModeInput", "checked", false);
      saveState();
      syncVoiceListening();
      currentSpeed = 0;
      updateHud();
    } else {
      if (!isScrolling) {
        isScrolling = true;
        if (currentSpeed === 0) currentSpeed = Number(state.startSpeed) || 2;
      } else {
        isScrolling = false;
      }
    }
    return;
  }

  if (!state.voiceMode) {
    if (matchBinding("speedUp", code, key) || isNextKey(code, key)) {
      isScrolling = true;
      currentSpeed = Math.round((currentSpeed + REMOTE_SPEED_STEP) * 100) / 100;
      return;
    }

    if (matchBinding("speedDown", code, key) || isPrevKey(code, key)) {
      isScrolling = true;
      currentSpeed = Math.round((currentSpeed - REMOTE_SPEED_STEP) * 100) / 100;
      return;
    }
  }
}

function matchBinding(action, code, key) {
  var b = state.bindings[action];
  if (!b) return false;
  if (b.code === "Space" || b.key === " ") return code === "Space" || key === " ";
  return b.code === code || b.key === key;
}

function isNextKey(c, k) {
  return c === "PageDown" || k === "PageDown" || c === "ArrowRight" || k === "ArrowRight";
}

function isPrevKey(c, k) {
  return c === "PageUp" || k === "PageUp" || c === "ArrowLeft" || k === "ArrowLeft";
}

/* ──────────────────────────────────────────────────────────────────────────
   Prompter lifecycle
────────────────────────────────────────────────────────────────────────── */

function startPrompter() {
  if (!state.text || !state.text.trim()) {
    alert("Please enter or import a script first.");
    return;
  }

  if (els.setupPage) els.setupPage.classList.add("hidden");
  if (els.prompterPage) els.prompterPage.classList.remove("hidden");
  document.body.classList.add("prompt-lock");

  prepareCanvasAndText();
  resetVoiceController();

  scrollPos = state.voiceMode ? getVoiceStartScroll() : 0;
  currentSpeed = 0;
  isScrolling = false;

  syncVoiceListening();
  updateVoiceUI();
  updateHud();
  drawCanvasFrame();

  if (rafId) cancelAnimationFrame(rafId);
  lastTime = performance.now();
  rafId = requestAnimationFrame(animationLoop);
}

function stopPrompter() {
  if (rafId !== null) {
    cancelAnimationFrame(rafId);
    rafId = null;
  }

  isScrolling = false;
  currentSpeed = 0;
  stopVoiceListening();

  if (els.prompterPage) els.prompterPage.classList.add("hidden");
  if (els.setupPage) els.setupPage.classList.remove("hidden");
  document.body.classList.remove("prompt-lock");

  renderSetup();
  renderKeyBindings();
  updateFlipButtons();
}

function resetScriptPositionKeepSpeed() {
  prepareCanvasAndText();

  if (state.voiceMode) {
    resetVoiceController();
    scrollPos = getVoiceStartScroll();
    currentSpeed = 0;
    isScrolling = false;
  } else {
    scrollPos = 0;
  }

  scrollPos = clamp(scrollPos, 0, maxScroll);
  drawCanvasFrame();
  updateHud();
}

/* ──────────────────────────────────────────────────────────────────────────
   Layout / canvas prep
────────────────────────────────────────────────────────────────────────── */

function prepareCanvasAndText() {
  if (!canvas || !ctx) return;

  dpr = Math.max(1, window.devicePixelRatio || 1);
  canvasW = Math.max(1, window.innerWidth);
  canvasH = Math.max(1, window.innerHeight);

  canvas.width = Math.round(canvasW * dpr);
  canvas.height = Math.round(canvasH * dpr);
  canvas.style.width = canvasW + "px";
  canvas.style.height = canvasH + "px";

  var mult = state.voiceMode ? VOICE_LINE_SPACING : MANUAL_LINE_SPACING;
  lineHeight = Math.round(state.textSize * mult);
  focusY = canvasH * (state.focusOffset / 100);
  startY = canvasH - lineHeight * 3;

  var left = canvasW * (state.indent / 100);
  var textWidth = Math.max(100, canvasW - left * 2);

  ctx.font = state.textSize + "px Arial, Helvetica, sans-serif";
  lines = wrapText(state.text || "", textWidth);
  lineWords = lines.map(function(line) {
    return splitWords(line);
  });
  calculateLineCharStarts();

  var lastIdx = Math.max(0, lines.length - 1);
  maxScroll = Math.max(
    0,
    startY + lastIdx * lineHeight + (state.textSize / 2) - focusY
  );
}

function wrapText(text, maxWidth) {
  var result = [];
  var paras = String(text)
    .replace(/\r\n/g, "\n")
    .replace(/\r/g, "\n")
    .split("\n");

  for (var p = 0; p < paras.length; p++) {
    var para = paras[p];

    if (!para.trim()) {
      result.push("");
      continue;
    }

    var words = para.split(/\s+/);
    var line = "";

    for (var w = 0; w < words.length; w++) {
      var test = line ? line + " " + words[w] : words[w];

      if (ctx.measureText(test).width <= maxWidth || !line) {
        line = test;
      } else {
        result.push(line);
        line = words[w];
      }
    }

    if (line) result.push(line);
  }

  return result;
}

function calculateLineCharStarts() {
  lineCharStarts = [];
  var total = 0;
  for (var i = 0; i < lines.length; i++) {
    lineCharStarts.push(total);
    total += lines[i].length + 1;
  }
}

/* ──────────────────────────────────────────────────────────────────────────
   Animation
────────────────────────────────────────────────────────────────────────── */

function animationLoop(now) {
  var dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;

  if (state.voiceMode && isListening) {
    updateVoiceScroll(dt);
  } else if (isScrolling && currentSpeed !== 0) {
    scrollPos += currentSpeed * PX_PER_SPEED_UNIT * dt;
  }

  scrollPos = clamp(scrollPos, 0, maxScroll);

  if (scrollPos >= maxScroll && !state.voiceMode) {
    isScrolling = false;
  }

  drawCanvasFrame();
  updateHud();
  rafId = requestAnimationFrame(animationLoop);
}

/* ──────────────────────────────────────────────────────────────────────────
   Drawing
────────────────────────────────────────────────────────────────────────── */

function drawCanvasFrame() {
  if (!ctx) return;

  ctx.save();
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  var bg = hexToRgb(state.bgColor);
  ctx.fillStyle = "rgba(" + bg.r + "," + bg.g + "," + bg.b + "," + (state.bgOpacity / 100) + ")";
  ctx.fillRect(0, 0, canvasW, canvasH);

  ctx.translate(canvasW / 2, canvasH / 2);
  ctx.scale(state.flipH ? -1 : 1, state.flipV ? -1 : 1);
  ctx.translate(-canvasW / 2, -canvasH / 2);

  ctx.font = state.textSize + "px Arial, Helvetica, sans-serif";
  ctx.textBaseline = "top";

  var left = canvasW * (state.indent / 100);
  var first = Math.max(0, Math.floor((scrollPos - startY) / lineHeight) - 3);
  var last = Math.min(lines.length - 1, Math.ceil((scrollPos + canvasH - startY) / lineHeight) + 3);

  for (var i = first; i <= last; i++) {
    var y = startY + i * lineHeight - scrollPos;
    ctx.fillStyle = (state.voiceMode && i === voiceCurrentLine) ? "#facc15" : state.textColor;
    ctx.fillText(lines[i], left, y);
  }

  if (state.focusEnabled) {
    var barTop = focusY - state.focusHeight / 2;
    ctx.fillStyle = "rgba(16,185,129,0.16)";
    ctx.fillRect(0, barTop, canvasW, state.focusHeight);

    ctx.strokeStyle = "rgba(16,185,129,0.45)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, barTop);
    ctx.lineTo(canvasW, barTop);
    ctx.moveTo(0, barTop + state.focusHeight);
    ctx.lineTo(canvasW, barTop + state.focusHeight);
    ctx.stroke();
  }

  ctx.restore();
}

function hexToRgb(hex) {
  var s = /^#[0-9a-fA-F]{6}$/.test(hex) ? hex : "#000000";
  return {
    r: parseInt(s.slice(1, 3), 16),
    g: parseInt(s.slice(3, 5), 16),
    b: parseInt(s.slice(5, 7), 16)
  };
}

function updateHud() {
  var inVoice = state.voiceMode && isListening;
  setProp("wpmHud", "textContent", inVoice ? Math.round(voiceCurrentWPM) : "–");
  setProp("speedHud", "textContent", inVoice ? Math.round(currentSpeed) : currentSpeed.toFixed(2));
  setProp("modeHud", "textContent", inVoice
    ? ("Voice L" + Math.min(lines.length, voiceCurrentLine + 1))
    : (isScrolling ? "Scrolling" : "Paused"));
  updateVoiceUI();
}

/* ──────────────────────────────────────────────────────────────────────────
   Voice control
────────────────────────────────────────────────────────────────────────── */

function syncVoiceListening() {
  if (!recognition) {
    updateVoiceUI();
    return;
  }

  if (state.voiceMode) {
    try {
      recognition.start();
      isListening = true;
    } catch (err) {
      isListening = true;
    }
  } else {
    stopVoiceListening();
  }

  updateVoiceUI();
}

function stopVoiceListening() {
  if (recognition) {
    try { recognition.stop(); } catch (err) {}
  }
  isListening = false;
  updateVoiceUI();
}

function updateVoiceUI() {
  var on = state.voiceMode && isListening;
  setProp("voiceStatusText", "textContent", on ? "Voice On" : "Voice Off");
  if (els.voiceToggleBtn) els.voiceToggleBtn.classList.toggle("voice-on", on);
}

/* ──────────────────────────────────────────────────────────────────────────
   Voice engine helpers
────────────────────────────────────────────────────────────────────────── */

function idealScrollForLine(i) {
  if (!lines.length) return 0;
  var idx = clamp(i, 0, lines.length - 1);
  return clamp(
    startY + idx * lineHeight + (state.textSize / 2) - focusY,
    0,
    maxScroll
  );
}

function getVoiceStartScroll() {
  return Math.max(0, startY + (state.textSize / 2) - focusY);
}

function getTotalWordCount() {
  var n = 0;
  for (var i = 0; i < lineWords.length; i++) {
    if (lineWords[i]) n += lineWords[i].length;
  }
  return n;
}

function getCumulativeWordsUpTo(idx) {
  var n = 0;
  for (var i = 0; i <= idx && i < lineWords.length; i++) {
    if (lineWords[i]) n += lineWords[i].length;
  }
  return n;
}

function resetVoiceController() {
  var now = performance.now();
  voiceCurrentLine = 0;
  voicePhantom = getVoiceStartScroll();
  voiceCurrentWPM = 150;
  voicePrevLine = 0;
  voicePrevLineTime = now;
  voiceSessionStart = now;
  voiceFinalBuf = "";
  voiceInterimBuf = "";
}

function updateVoiceScroll(dt) {
  var totalWords = getTotalWordCount();
  var wps = voiceCurrentWPM / 60;

  var baseSpeed = totalWords > 0
    ? (maxScroll * wps) / totalWords
    : 50;

  voicePhantom = Math.min(maxScroll, voicePhantom + baseSpeed * dt);

  var error = voicePhantom - scrollPos;
  var speed = clamp(error * V_SPRING_K, 0, V_MAX_PX_S);

  currentSpeed = speed;
  scrollPos += speed * dt;
  scrollPos = clamp(scrollPos, 0, maxScroll);
}

/* ──────────────────────────────────────────────────────────────────────────
   Speech result handling
────────────────────────────────────────────────────────────────────────── */

function handleSpeechResult(event) {
  if (!state.voiceMode || !lines.length) return;

  var now = performance.now();

  for (var i = event.resultIndex; i < event.results.length; i++) {
    if (event.results[i].isFinal) {
      voiceFinalBuf += event.results[i][0].transcript + " ";
    } else {
      voiceInterimBuf = event.results[i][0].transcript;
    }
  }

  var fw = splitWords(voiceFinalBuf);
  if (fw.length > 50) {
    voiceFinalBuf = fw.slice(-50).join(" ") + " ";
  }

  var corpus = splitWords(voiceFinalBuf).slice(-12).concat(splitWords(voiceInterimBuf));
  if (!corpus.length) return;

  var match = findBestMatch(corpus, now);
  if (!match) return;

  var lineIndex = match.lineIndex;
  var progress = match.progress;

  if (!isLinePlausible(lineIndex, now)) return;
  if (lineIndex < voiceCurrentLine) return;

  if (lineIndex > voicePrevLine) {
    var wordsAdv = getCumulativeWordsUpTo(lineIndex) - getCumulativeWordsUpTo(voicePrevLine);
    var timeAdv = (now - voicePrevLineTime) / 1000;

    if (wordsAdv > 0 && timeAdv > 0.3) {
      var measured = (wordsAdv / timeAdv) * 60;
      if (measured >= V_MIN_WPM && measured <= V_MAX_WPM) {
        voiceCurrentWPM = voiceCurrentWPM * 0.70 + measured * 0.30;
      }
    }

    voicePrevLine = lineIndex;
    voicePrevLineTime = now;
  }

  voiceCurrentLine = lineIndex;

  var lineIdeal = idealScrollForLine(lineIndex);
  var nextIdeal = idealScrollForLine(Math.min(lines.length - 1, lineIndex + 1));
  var recScroll = lineIdeal + clamp(progress, 0, 1) * (nextIdeal - lineIdeal);

  if (recScroll > voicePhantom) {
    voicePhantom = recScroll;
  }
}

function findBestMatch(corpus, now) {
  var maxPlaus = getMaxPlausibleLine(now);
  var searchEnd = Math.min(lines.length - 1, Math.max(voiceCurrentLine + V_SEARCH, maxPlaus));
  var best = null;

  for (var i = voiceCurrentLine; i <= searchEnd; i++) {
    var lw = lineWords[i];
    if (!lw || lw.length === 0) continue;

    var result = scoreMatch(lw, corpus);
    if (!best || result.score > best.score) {
      best = {
        lineIndex: i,
        score: result.score,
        progress: result.progress
      };
    }
  }

  return (best && best.score >= V_THRESH) ? best : null;
}

function scoreMatch(lineWordsArr, corpus) {
  if (!lineWordsArr.length || !corpus.length) {
    return { score: 0, progress: 0 };
  }

  var avail = {};
  for (var j = 0; j < corpus.length; j++) {
    var cw = corpus[j];
    avail[cw] = (avail[cw] || 0) + 1;
  }

  var matched = 0;
  var lastMatchIdx = -1;

  for (var i = 0; i < lineWordsArr.length; i++) {
    var lw = lineWordsArr[i];
    if (avail[lw] > 0) {
      matched++;
      lastMatchIdx = i;
      avail[lw]--;
    }
  }

  return {
    score: matched / lineWordsArr.length,
    progress: lastMatchIdx >= 0 ? (lastMatchIdx + 1) / lineWordsArr.length : 0
  };
}

function getMaxPlausibleLine(now) {
  var elapsed = Math.max(0.1, (now - voiceSessionStart) / 1000);
  var maxWords = elapsed * (V_MAX_WPM / 60) * V_BURST;
  var count = 0;
  var maxLine = voiceCurrentLine + 1;

  for (var i = 0; i < lines.length; i++) {
    count += lineWords[i] ? lineWords[i].length : 0;
    if (count <= maxWords) {
      if (i > maxLine) maxLine = i;
    } else {
      break;
    }
  }

  return Math.min(lines.length - 1, maxLine);
}

function isLinePlausible(lineIndex, now) {
  return lineIndex <= getMaxPlausibleLine(now);
}

/* ──────────────────────────────────────────────────────────────────────────
   Text normalization
────────────────────────────────────────────────────────────────────────── */

function normalise(text) {
  return String(text || "")
    .toLowerCase()
    .replace(/[^\w\s']/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

function splitWords(text) {
  var clean = normalise(text);
  return clean ? clean.split(/\s+/) : [];
}

/* ──────────────────────────────────────────────────────────────────────────
   Boot
────────────────────────────────────────────────────────────────────────── */

document.addEventListener("DOMContentLoaded", init);
</script>
